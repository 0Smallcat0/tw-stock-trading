version: "1"
data_source:
  provider: twse_public
  symbols:
    - "0050"
  timeframe: 1d
  twse_rwd_base_url: https://www.twse.com.tw
  twse_openapi_base_url: https://openapi.twse.com.tw
  finmind_api_base_url: https://api.finmindtrade.com
  backfill_provider: finmind_public
  # TWSE daily OHLCV is final around 17:30 Taipei (odd-lot + block volume);
  # the daily job never runs earlier than 18:00 Taipei.
  daily_job_time_taipei: "18:00"
  # TWSE rate limits are undocumented; sequential requests spaced >= 3s
  # avoid the community-reported IP bans.
  min_request_interval_seconds: "3"
  timeout_seconds: "10"
  private_api_enabled: false
  api_key_required: false
strategy:
  # Daily Trend Ensemble has no tunable parameters by contract:
  # docs/contracts/STRATEGY_DAILY_TREND_ENSEMBLE.md fixes SMA 20/65/150/200.
  name: daily_trend_ensemble
  allowed_signals:
    - LONG
    - FLAT
  allow_short: false
portfolio:
  # Decision universe: 0050 alone at 100% risk budget. 2330 single-stock
  # timing is excluded by evidence; a second asset needs its own gate pass
  # (docs/contracts/UNIVERSE_CONTRACT.md).
  max_active_positions: 1
  max_symbol_weight: "1.0"
  max_gross_exposure: "1.0"
  cash_allowed: true
  cooldown_enabled: true
  allow_short: false
  risk_budgets:
    "0050": "1.0"
risk:
  min_notional_twd: "10000"
  # Interim wall-clock staleness; Goal TW-D replaces it with a trading-day
  # rule over the exchange calendar (weekends/holidays are not staleness).
  stale_data_max_age_seconds: 345600
  # Expected strategy drawdown band is 15-25%; the pause is a disaster brake
  # above that band (0050 buy-and-hold worst case was -58% in 2008).
  max_drawdown_fraction: "0.40"
  daily_loss_pause_fraction: "0.095"
  # Under the ±10% price limit a -20% day is impossible; -9% is limit-down
  # territory (2025-04-07: 0050's first-ever limit-down close).
  disaster_single_day_drop_fraction: "0.09"
  short_exposure_enabled: false
  margin_enabled: false
  leverage_enabled: false
execution:
  mode: paper
  # Interim flat-bps model. Goal TW-D introduces the full TW cost model:
  # commission 0.1425%/side x broker discount with a minimum fee, sell-only
  # transaction tax (ETF 0.1% / stock 0.3%), bracketed tick table.
  fee_bps: "13.5"
  slippage_bps: "5"
  # Odd-lot share granularity; 0050 is the most-traded odd-lot name on TWSE.
  quantity_step: "1"
  # ETF tick bracket at 0050's current price (>= NT$50).
  price_tick: "0.05"
  real_orders_enabled: false
  private_api_enabled: false
  margin_enabled: false
  leverage_enabled: false
account:
  account_id: paper-main
  initial_cash: "100000"
  quote_asset: TWD
runtime:
  mode: paper
  decision_timeframe: 1d
  config_snapshot_required: true
  halt_on_stale_data: true
  idempotency_key_namespace: tw-paper-runtime
  real_trading_enabled: false
  private_api_enabled: false
storage:
  backend: postgresql
  host: localhost
  # 54321 avoids colliding with the crypto sibling project's DB on 54320.
  port: 54321
  database: tw_quant
  username: tw
  password: tw_dev_only
  calendar_schedule_directory: data/calendar
  snapshot_directory: docs/reports/config-snapshots
  trial_registry_path: docs/reports/research/trial_registry.jsonl
  holdout_lock_path: docs/reports/research/holdout_lock.json
  backtest_reports_directory: docs/reports/backtests
  candle_files_directory: data/candles
  runtime_events_path: data/runtime/events.jsonl
notifications:
  enabled: true
  channel: log
  webhook_url: ""
api_dashboard:
  enabled: true
  host: 127.0.0.1
  port: 8001
  read_only: true
  manual_orders_enabled: false
  risk_limit_mutation_enabled: false
  private_account_access_enabled: false
