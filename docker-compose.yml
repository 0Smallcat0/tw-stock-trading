services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: tw_stock_trading_timescaledb
    environment:
      POSTGRES_USER: tw
      POSTGRES_PASSWORD: tw_dev_only
      POSTGRES_DB: tw_quant
    ports:
      # 54321 keeps the TW database clear of the crypto sibling on 54320.
      - "54321:5432"
    volumes:
      - tw_timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tw -d tw_quant"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  tw_timescaledb_data:
